name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint shell scripts
        run: shellcheck setup.sh login.sh verify.sh dc.sh

      - name: Validate the compose files
        run: |
          ref=$(grep -E '^SUPOCLIP_REF=' setup.sh | cut -d= -f2)
          git clone --quiet https://github.com/FujiwaraChoki/supoclip.git supoclip
          git -C supoclip checkout --quiet "$ref"
          python3 gen_env.py
          ./dc.sh config --quiet
